<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - CR7</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080405;
            --card: #12080a;
            --border: #2e151a;
            --accent: #ff2433;
            --accent-hover: #d41926;
            --green: #00e676;
            --text: #f2e8e9;
            --muted: #967c7f;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Cairo', Tahoma, sans-serif;
            padding: 20px 14px 40px;
            margin: 0;
        }
        .container { max-width: 520px; margin: 0 auto; }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 24px rgba(0,0,0,0.6);
        }
        h2 {
            color: var(--accent);
            margin: 0 0 14px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            text-align: right;
            font-size: 13px;
            color: var(--muted);
        }
        select, input[type="text"], textarea {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #381b20;
            background: #070304;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }
        input.mono { font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: left; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-toggle { background: #291a1d; color: #fff; border: 1px solid #45242a; }
        .btn-toggle.active { background: #00aa55; border-color: #00cc66; }
        .result-box {
            margin-top: 14px;
            background: #050203;
            padding: 12px;
            color: var(--green);
            word-break: break-all;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            text-align: center;
            border: 1px dashed rgba(0, 230, 118, 0.5);
            cursor: pointer;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .status-off { background: rgba(0, 230, 118, 0.14); color: var(--green); }
        .status-on { background: rgba(255, 36, 51, 0.18); color: var(--accent); }
        .key-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
        .key-item {
            background: #090405;
            border: 1px solid #261216;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }
        .key-code { font-family: 'JetBrains Mono', monospace; color: #fff; font-weight: 700; direction: ltr; }
        .key-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
        .mini-btns { display: flex; gap: 6px; }
        .mini-btn {
            width: auto;
            padding: 6px 10px;
            font-size: 11px;
            border-radius: 4px;
            background: #241215;
            color: #fff;
        }
        .mini-btn.del { background: #59121b; color: #ff8a93; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. قسم توليد الأكواد -->
    <div class="card">
        <h2>مولد أكواد CR7</h2>
        <label>اختر مدة صلاحية الكود:</label>
        <select id="duration">
            <option value="1">ساعة واحدة (1 Hour)</option>
            <option value="2">ساعتين (2 Hours)</option>
            <option value="24">24 ساعة - يوم واحد</option>
            <option value="72">3 أيام</option>
            <option value="168">أسبوع كامل (7 Days)</option>
            <option value="720">شهر كامل (30 Days)</option>
        </select>
        <button class="btn-primary" onclick="generateKey()">توليد مفتاح جديد</button>
        <div class="result-box" id="keyResult" onclick="copyKey()" title="اضغط للنسخ">انقر فوق توليد لإظهار الكود...</div>
    </div>

    <!-- 2. قسم روابط الميزات (HAPP LINKS) -->
    <div class="card">
        <h2>روابط الميزات (Happ Configs)</h2>
        <label>AIMBOT — Head (100%)</label>
        <input type="text" class="mono" id="link_aim_head" placeholder="happ://crypt/...">

        <label>AIMBOT — Neck (90%)</label>
        <input type="text" class="mono" id="link_aim_neck" placeholder="happ://crypt/...">

        <label>AIMBOT — Shoulder (73%)</label>
        <input type="text" class="mono" id="link_aim_shoulder" placeholder="happ://crypt/...">

        <label>AIMBOT — Upper Chest (50%)</label>
        <input type="text" class="mono" id="link_aim_upperchest" placeholder="happ://crypt/...">

        <label>AIMBOT — Lower Chest (30%)</label>
        <input type="text" class="mono" id="link_aim_lowerchest" placeholder="happ://crypt/...">

        <label>AIMBOT — Pelvis (0%)</label>
        <input type="text" class="mono" id="link_aim_pelvis" placeholder="happ://crypt/...">

        <label>الميزة الشاملة (AIM NECK + DRONE + Auto Revive + Gloo Wall)</label>
        <input type="text" class="mono" id="link_Neck" placeholder="happ://crypt/...">

        <button class="btn-primary" onclick="saveLinks()">حفظ جميع الروابط</button>
    </div>

    <!-- 3. قسم إدارة الصيانة -->
    <div class="card">
        <h2>لوحة إدارة الصيانة</h2>
        <div id="statusBadge" class="status-badge status-off">حالة الموقع: يعمل بشكل طبيعي</div>
        <label>رسالة الصيانة التي ستظهر للمستخدمين:</label>
        <textarea id="maintenanceMsg" rows="3">نقوم بأعمال الصيانة. كل شيء متوقف مؤقتاً حتى نعود.</textarea>
        <button id="maintenanceBtn" class="btn-toggle" onclick="toggleMaintenance()">تفعيل وضع الصيانة</button>
    </div>

    <!-- 4. قائمة الأكواد النشطة -->
    <div class="card">
        <h2>الأكواد المُنشأة (<span id="keysCount">0</span>)</h2>
        <div class="key-list" id="keysList"></div>
    </div>
</div>

<script>
    let isMaintenanceActive = false;
    const LINK_KEYS = ['aim_head', 'aim_neck', 'aim_shoulder', 'aim_upperchest', 'aim_lowerchest', 'aim_pelvis', 'Neck'];

    async function loadSettings() {
        try {
            const res = await fetch('/api/admin/settings', { cache: 'no-store' });
            const data = await res.json();
            if (data.success) {
                isMaintenanceActive = !!(data.maint && data.maint.on);
                if (data.maint && data.maint.msg) {
                    document.getElementById('maintenanceMsg').value = data.maint.msg;
                }
                updateMaintenanceUI();

                if (data.links) {
                    LINK_KEYS.forEach(k => {
                        const el = document.getElementById('link_' + k);
                        if (el) el.value = data.links[k] || '';
                    });
                }
                renderKeys(data.keys || []);
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function generateKey() {
        const hours = document.getElementById('duration').value;
        const res = await fetch('/api/admin/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hours: parseFloat(hours) })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('keyResult').innerText = data.key;
            loadSettings();
        }
    }

    function copyKey() {
        const txt = document.getElementById('keyResult').innerText;
        if (txt.startsWith('CR7-')) {
            navigator.clipboard.writeText(txt);
            alert('تم نسخ الكود: ' + txt);
        }
    }

    async function saveLinks() {
        const links = {};
        LINK_KEYS.forEach(k => {
            links[k] = document.getElementById('link_' + k).value.trim();
        });
        const res = await fetch('/api/admin/links', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ links })
        });
        const data = await res.json();
        if (data.success) {
            alert('تم حفظ روابط Happ بنجاح!');
        }
    }

    async function toggleMaintenance() {
        isMaintenanceActive = !isMaintenanceActive;
        const msg = document.getElementById('maintenanceMsg').value;

        const res = await fetch('/api/admin/maintenance', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ on: isMaintenanceActive, msg })
        });
        const data = await res.json();
        if (data.success) {
            updateMaintenanceUI();
            alert(isMaintenanceActive ? 'تم تفعيل وضع الصيانة وإيقاف الموقع!' : 'تم إيقاف الصيانة وفتح الموقع.');
        }
    }

    function updateMaintenanceUI() {
        const btn = document.getElementById('maintenanceBtn');
        const badge = document.getElementById('statusBadge');
        if (isMaintenanceActive) {
            btn.innerText = 'إلغاء الصيانة (فتح الموقع)';
            btn.classList.add('active');
            badge.innerText = 'حالة الموقع: متوقف للصيانة';
            badge.className = 'status-badge status-on';
        } else {
            btn.innerText = 'تفعيل وضع الصيانة';
            btn.classList.remove('active');
            badge.innerText = 'حالة الموقع: يعمل بشكل طبيعي';
            badge.className = 'status-badge status-off';
        }
    }

    function renderKeys(keys) {
        document.getElementById('keysCount').innerText = keys.length;
        const list = document.getElementById('keysList');
        list.innerHTML = '';
        keys.slice().reverse().forEach(k => {
            const hrs = Math.round((k.durationMs || 0) / 3600000);
            const status = !k.expiresAt
                ? 'غير مُفعّل بعد'
                : (Date.now() < k.expiresAt ? 'نشط (' + (k.hwid || 'بدون جهاز') + ')' : 'منتهي الصلاحية');
            const div = document.createElement('div');
            div.className = 'key-item';
            div.innerHTML = `
                <div>
                    <div class="key-code">${k.code}</div>
                    <div class="key-meta">المدة: ${hrs} ساعة | ${status}</div>
                </div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="keyAction('${k.code}','reset')">فك الجهاز</button>
                    <button class="mini-btn del" onclick="keyAction('${k.code}','delete')">حذف</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    async function keyAction(code, action) {
        await fetch('/api/admin/key-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, action })
        });
        loadSettings();
    }

    loadSettings();
</script>
</body>
    </html>
